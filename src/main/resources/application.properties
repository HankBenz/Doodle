spring.application.name=Doodle
doodle.cors.path-patterns=/**
doodle.cors.allowed-origins=
doodle.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
doodle.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
doodle.cors.allowed-headers=*
doodle.cors.exposed-headers=
doodle.cors.allow-credentials=true
doodle.cors.allow-private-network=false
doodle.cors.max-age=30m
spring.jpa.hibernate.ddl-auto=validate
spring.security.oauth2.client.registration.keycloak.client-id=doodle
spring.security.oauth2.client.registration.keycloak.client-secret=doodle-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/doodle
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.resourceserver.jwt.issuer-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri}
springdoc.swagger-ui.oauth.client-id=SwaggerUI
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
spring.r2dbc.password=P@s3woooord
spring.flyway.url=jdbc:postgresql://localhost:15432/doodle
spring.flyway.user=doodle
spring.flyway.password=P@s3woooord
spring.datasource.url=jdbc:postgresql://localhost:15432/doodle
spring.datasource.username=doodle
spring.datasource.password=P@s3woooord
