spring:
  application:
    name: doodle-scheduling
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
    username: ${SPRING_DATASOURCE_USERNAME:doodle}
    password: ${SPRING_DATASOURCE_PASSWORD:doodle}
    hikari:
      pool-name: doodle
      # The pool is sized for Postgres, not for the number of virtual threads.
      maximum-pool-size: 20
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 25
      jakarta.persistence.lock.timeout: 3000
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: doodle-scheduling
    description: Meeting scheduling service

doodle:
  slot:
    min-duration-minutes: 15
    max-duration-minutes: 720
  availability:
    max-window-days: 366
    max-users: 30
  meeting:
    max-participants: 50
