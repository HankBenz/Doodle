# Keycloak: http://localhost:8180 (realm doodle, user doodle / doodle, admin admin / admin)
# pgAdmin: http://localhost:5050 (admin@doodle.dev / admin), server "Doodle" is preloaded
# Postgres publishes 5432 on a random host port; Spring Boot's Docker Compose support picks it up.
services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: doodle
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U doodle -d doodle' ]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.7.3'
    command: [ 'start-dev', '--import-realm' ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8180:8080'
    volumes:
      - ./docker/keycloak/doodle-realm.json:/opt/keycloak/data/import/doodle-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/8080"' ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  pgadmin:
    image: 'dpage/pgadmin4:9.19'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@doodle.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DISABLE_POSTFIX: 'True'
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      PGPASS_FILE: /pgadmin4/pgpass
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy

  doodle:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '18080:8080'
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/doodle
      SPRING_DATASOURCE_USERNAME: doodle
      SPRING_DATASOURCE_PASSWORD: doodle
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/doodle/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/doodle/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/doodle/protocol/openid-connect/userinfo
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
